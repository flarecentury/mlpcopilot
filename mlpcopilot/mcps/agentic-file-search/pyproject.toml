[build-system]
requires = ["uv_build>=0.9.10,<0.10.0"]
build-backend = "uv_build"

[project]
name = "agentic-file-search-mcp"
version = "0.1.0"
description = "Single-tool MCP server and agentic local document search skill for MLP Copilot."
readme = "README.md"
requires-python = ">=3.10"
keywords = ["mcp", "agentic-search", "local-files", "document-search"]
dependencies = [
    "docling>=2.55.0",
    "duckdb>=1.0.0",
    "fastmcp>=2.14.5",
    "fastapi>=0.115.0",
    "google-genai>=1.55.0",
    "langextract>=1.0.0",
    "llama-index-workflows>=2.11.5",
    "python-dotenv>=1.0.0",
    "reportlab>=4.4.7",
    "rich>=13.0.0",
    "typer>=0.12.5,<0.20.0",
    "uvicorn>=0.34.0",
    "websockets>=14.0",
]

[dependency-groups]
dev = [
    "pre-commit>=4.5.0",
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
    "ruff>=0.14.9",
    "ty>=0.0.1a33",
]

[project.scripts]
explore = "fs_explorer.main:app"
explore-ui = "fs_explorer.server:run_server"
agentic-file-search-mcp = "fs_explorer.mcp_server:main"
agentic-file-search-mcp-stdio = "fs_explorer.mcp_server:main"
agentic-file-search-mcp-http = "fs_explorer.mcp_server:main_http"
fs-explorer-mcp = "fs_explorer.mcp_server:main"
fs-explorer-mcp-stdio = "fs_explorer.mcp_server:main"
fs-explorer-mcp-http = "fs_explorer.mcp_server:main_http"

[tool.uv.build-backend]
module-name = "fs_explorer"
