[build-system]
requires = ["uv_build>=0.9.10,<0.10.0"]
build-backend = "uv_build"

[project]
name = "mlp-training-controller-mcp"
version = "0.1.0"
description = "MCP server for MLP active-learning training workflow control."
requires-python = ">=3.11"
dependencies = [
    "dpgen",
    "fastmcp>=2.14.5",
    "pyyaml>=6.0,<7.0",
]

[project.scripts]
mlp-training-controller-mcp = "mlp_training_controller_mcp.server:main"
mlp-training-controller-mcp-stdio = "mlp_training_controller_mcp.server:main"

[tool.uv.build-backend]
module-name = "mlp_training_controller_mcp"

